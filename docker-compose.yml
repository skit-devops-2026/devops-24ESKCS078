
services:
  mongo:
    image: mongo:7
    container_name: optilife-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./Optilife-ht/backend/mongodb-backup:/backup:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Optilife-ht/backend
      dockerfile: Dockerfile
    container_name: optilife-backend
    restart: unless-stopped
    env_file:
      - ./Optilife-ht/backend/.env
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongo:27017/habit_tracker
      CLIENT_URL: http://localhost:8081
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5003"

  frontend:
    build:
      context: ./Optilife-ht/frontend
      dockerfile: Dockerfile
    container_name: optilife-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: optilife-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
  grafana:
    image: grafana/grafana:latest
    container_name: optilife-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus 

volumes:
  mongo_data:
  grafana_data:
