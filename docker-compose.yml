
services:
  mongo:
    image: mongo:7
    container_name: optilife-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./Optilife-ht/backend/mongodb-backup:/backup:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Optilife-ht/backend
      dockerfile: Dockerfile
    container_name: optilife-backend
    restart: unless-stopped
    env_file:
      - ./Optilife-ht/backend/.env
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongo:27017/habit_tracker
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5003"

  frontend:
    build:
      context: ./Optilife-ht/frontend
      dockerfile: Dockerfile
    container_name: optilife-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mongo_data:
